  <circle cx="340" cy="512" r="32" fill="url(#yellow)"/>
  <rect x="414" y="494" width="230" height="36" rx="18" fill="#1d1d3a" opacity="0.2"/>

  <circle cx="340" cy="642" r="42" fill="#ff3b30" opacity="0.25"/>
  <circle cx="340" cy="642" r="32" fill="url(#red)"/>
