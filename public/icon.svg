  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <circle cx="860" cy="880" r="300" fill="#8b5cf6" opacity="0.35"/>

  <rect x="222" y="242" width="580" height="540" rx="104" fill="url(#card)"/>
  <rect x="224" y="244" width="576" height="536" rx="102" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <circle cx="340" cy="382" r="42" fill="#34c759" opacity="0.25"/>
