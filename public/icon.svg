<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34a8ff"/>
      <stop offset="0.5" stop-color="#3d5afe"/>
      <stop offset="1" stop-color="#6a35e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#eef1ff" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="green" cx="0.36" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#e9ffef"/>
      <stop offset="0.35" stop-color="#4cd964"/>
      <stop offset="1" stop-color="#1c9442"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.36" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#ffd60a"/>
      <stop offset="1" stop-color="#d49a00"/>
    </radialGradient>
    <radialGradient id="red" cx="0.36" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffe7e5"/>
      <stop offset="0.35" stop-color="#ff453a"/>
      <stop offset="1" stop-color="#c41a10"/>
